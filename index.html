<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לו"ז שנתי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16233a;--mute:#5d6b82;--line:#dde3ea;--accent:#1f4fd8;--today:#e5484d;--off:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#10151e;--card:#182030;--ink:#e8edf5;--mute:#93a0b5;--line:#27324a;--accent:#7aa2ff;--off:#141b29}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:16px;line-height:1.45}
header{padding:20px 20px 8px;max-width:1200px;margin:auto}
h1{font-family:'Secular One',Assistant,sans-serif;font-weight:400;font-size:clamp(26px,5vw,38px);margin:0 0 4px}
.sub{color:var(--mute);margin:0;font-size:14px}
.bar{max-width:1200px;margin:auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1200px;margin:auto;padding:4px 20px 40px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px;font-size:14px;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:clip}
.note{max-width:1200px;margin:auto;padding:4px 20px;color:var(--mute);font-size:14px}
.note button{font:inherit;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline}
.cancel{text-decoration:line-through;opacity:.55}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.mnav h2{margin:0;font-family:'Secular One',Assistant,sans-serif;font-weight:400;font-size:22px}
.mnav button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:38px;height:34px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dh{padding:6px;text-align:center;font-weight:600;color:var(--mute);font-size:14px;border-bottom:1px solid var(--line)}
.day{min-height:112px;padding:4px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.day.out{opacity:.35}.day.wk{background:var(--off)}
.n{font-size:13px;color:var(--mute);padding:0 4px;display:flex;justify-content:space-between}
.n small{font-size:11px;opacity:.8}
.day.today .n b{background:var(--today);color:#fff;border-radius:10px;padding:0 7px}
.chip{display:block;width:100%;text-align:start;border:0;font:inherit;font-size:12.5px;line-height:1.3;color:#fff;border-radius:5px;padding:2px 6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.more{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
.gs{overflow-x:auto}.gw{min-width:980px;position:relative}
.gr{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line);align-items:center}
.gr.head{background:var(--card);font-weight:600;font-size:13px;color:var(--mute)}
.gl{padding:6px 12px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl small{display:block;color:var(--mute);font-size:12px}
.tk{position:relative;height:38px;border-inline-start:1px solid var(--line)}
.days{display:flex;height:46px}
.days span{flex:1;min-width:0;text-align:center;padding-top:5px;font-size:13px;line-height:1.2;border-inline-end:1px solid var(--line);color:var(--ink);transition:background .1s}
.days small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.days .wk{background:var(--off)}
.days .hl{background:var(--accent);color:#fff}.days .hl small{color:#fff}
.tk{background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.gr.dim{opacity:.4}.gr.on{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.hv{position:absolute;top:0;bottom:0;inset-inline-start:240px;inset-inline-end:0;pointer-events:none;z-index:3}
.hv i{position:absolute;top:0;bottom:0;width:2px;margin-inline-start:-1px;background:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.gw{cursor:crosshair}.gw .bar1{cursor:pointer}
.bar1{position:absolute;top:9px;height:20px;border:0;border-radius:5px;min-width:6px;cursor:pointer}
.tl{position:absolute;top:0;bottom:0;width:2px;background:var(--today);pointer-events:none;z-index:2}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:start;background:none;color:inherit;font:inherit;cursor:pointer}
.item i{align-self:stretch;border-radius:3px}.item b{display:block}.item span{color:var(--mute);font-size:14px}
.when{font-size:14px;color:var(--mute);white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:0;max-width:460px;width:92vw;background:var(--card);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
.dh2{padding:16px 18px;color:#fff}.dh2 h3{margin:0;font-family:'Secular One',Assistant,sans-serif;font-weight:400;font-size:21px;line-height:1.35}
dl{margin:0;padding:12px 18px}dt{color:var(--mute);font-size:13px;margin-top:8px}dd{margin:0}
.x{margin:0 18px 16px;font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.xs{overflow:auto;max-height:75vh}
@media (min-width:900px){.xs{overflow:visible;max-height:none}}
.xt thead th{position:sticky;z-index:2;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--bg) 30%,var(--ink))}
.xt thead tr:first-child th{top:0}
.xt thead tr:nth-child(2) th{top:var(--h1,34px)}
.xt{width:100%;min-width:780px;border-collapse:collapse;font-size:14px}
.xt th,.xt td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:center}
.xt thead th{background:var(--ink);color:var(--bg);font-weight:600;border-color:color-mix(in srgb,var(--bg) 30%,var(--ink))}
.xt td.d{white-space:nowrap;font-weight:600;width:96px}
.xt td.d small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.xt td.w{white-space:nowrap;width:76px}
.xt tr.wk td{background:var(--off)}
.xt tr.today td.d{box-shadow:inset -4px 0 0 var(--today)}
.xt tbody tr:hover td{background:color-mix(in srgb,var(--accent) 14%,var(--card));border-top-color:var(--accent);border-bottom-color:var(--accent)}
.xt tbody tr:hover td.d,.xt tbody tr:hover td.w{background:var(--accent);color:#fff}
.xt tbody tr:hover td.d small{color:#fff}
.ce{display:block;width:100%;text-align:start;border:0;background:none;color:inherit;font:inherit;font-size:13.5px;line-height:1.35;padding:2px 6px;margin:2px 0;border-inline-start:4px solid var(--c);border-radius:3px;cursor:pointer}
#today.tb{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
#login.lg{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
@media (prefers-color-scheme:dark){#today.tb{color:#10151e}}
@media (max-width:640px){.dh{font-size:11px;padding:6px 2px}.days small{display:none}.days{height:34px}.day{min-height:74px}.chip{font-size:11px;padding:1px 3px}.n small{display:none}.gr{grid-template-columns:150px 1fr}}
@media print{.bar,.note{display:none}}
</style>
</head>
<body>
<header><h1 id="title"></h1><p class="sub" id="sub"></p></header>
<div class="bar" role="toolbar" aria-label="תצוגה וסינון">
  <div class="seg" role="group" aria-label="תצוגה">
    <button data-v="table" aria-pressed="true">טבלה</button>
    <button data-v="month" aria-pressed="false">לוח שנה</button>
    <button data-v="list" aria-pressed="false">רשימה</button>
  </div>
  <select id="fGroup" aria-label="סוג"><option value="">כל הסוגים</option></select>
  <select id="fAud" aria-label="קהל יעד"><option value="">כל הקהלים</option></select>
  <input id="q" type="search" placeholder="חיפוש אירוע" aria-label="חיפוש">
  <button id="today" class="tb" type="button"></button>
  <button id="login" class="lg" type="button"></button>
</div>
<div class="note" id="note" hidden></div>
<main><div class="legend" id="legend"></div><div class="panel" id="view"></div></main>
<dialog id="dlg"></dialog>

<script>
/* ===== חיבור לגיליון ===== */
const CONFIG = {
  TITLE: 'לו"ז שנתי - חטיבת אלה תשפ"ז',
  SHEET_ID: '1BC1Jsy0VxK7x2ledxD9Dypdx1UKbfHwuPMV8rfNYqP4',   // זמני: קריאה ישירה של החודש הנוכחי (הגיליון חייב להיות פתוח לצפייה). לא מאובטח.
  SCRIPT_URL: '',               // כתובת ה-Web App מ-Apps Script (נגמרת ב-/exec)
  HIDE_GROUPS: [],              // הסתרה בתצוגה בלבד, אינה אבטחה
  REFRESH_MINUTES: 10
};
let restricted=true;            // true = רק החודש הנוכחי; המצב נקבע על ידי השרת
/* ======================== */

const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const GCOL={"פדגוגיה":"#1d4ed8","תלמידים":"#15803d","חגים ואירועי לוח שנה":"#b45309"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').replace(/\s+/g,' ').trim();
const dn=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const fromN=n=>{const d=new Date(n*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12)};
const col=g=>GCOL[g]||'#6b7280';
let all=[],hebrew={},layouts={},view='table',cur=null,eid=0;

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!='\r')f+=c;}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
function groupOf(label,carry){
  if(/^(הנהלה|מורים)/.test(label))return'פדגוגיה';
  if(/^(שכבה|חטיבת)/.test(label))return'תלמידים';
  return carry||'אחר';
}
function parseTab(text,name){
  const rows=parseCSV(text),hi=rows.findIndex(r=>norm(r[0])=='תאריך');
  if(hi<1)return[];
  const title=rows.slice(0,hi).flat().find(c=>c.includes('לחודש'))||name;
  const month=MONTHS.findIndex(m=>title.includes(m))+1||MONTHS.indexOf(name)+1;
  const year=+(title.match(/20\d\d/)||[new Date().getFullYear()])[0];
  const aud=rows[hi-1]||[],hdr=rows[hi],grp=rows[hi-2]||[],cols=[];
  let carry='';
  for(let c=2;c<hdr.length;c++){
    carry=norm(grp[c])||carry;const label=norm(aud[c]);
    if(norm(hdr[c])=='שם האירוע')cols.push({c,aud:'לוח שנה וחגים',group:'חגים ואירועי לוח שנה'});
    else if(label)cols.push({c,aud:label,group:groupOf(label,carry)});
  }
  layouts[year*12+month-1]={mon:norm(grp[0]),heb:norm(grp[1]),cols:cols.map(({aud,group})=>({aud,group}))};
  const out=[];let day=null;
  for(const row of rows.slice(hi+1)){
    const a=norm(row[0]),m=a.match(/^(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4})/);
    if(m){
      let y=year,mo=month,d;const p=[+m[1],+m[2],+m[3]];
      if(m[1].length==4){y=p[0];mo=p[1];d=p[2]}else d=p[0]==month&&p[1]!=month?p[1]:p[1]==month?p[0]:p[1];
      day={date:new Date(y,mo-1,d,12)};
    }else if(a&&day){hebrew[dn(day.date)]=a}
    if(!day)continue;
    for(const k of cols){const v=norm(row[k.c]);if(v)out.push({title:v,aud:k.aud,group:k.group,sn:dn(day.date)})}
  }
  return out;
}
function merge(list){
  list.sort((a,b)=>(a.aud+a.title).localeCompare(b.aud+b.title)||a.sn-b.sn);
  const res=[];
  for(const e of list){
    const p=res[res.length-1];let ok=false;
    if(p&&p.aud==e.aud&&p.title==e.title){
      const gap=e.sn-p.en;ok=gap<=1;
      if(!ok&&gap<=3){ok=true;for(let n=p.en+1;n<e.sn;n++){const w=fromN(n).getDay();if(w!=5&&w!=6)ok=false}}
    }
    if(ok)p.en=e.sn;else res.push({...e,en:e.sn,id:++eid});
  }
  return res.map(e=>({...e,s:fromN(e.sn),e:fromN(e.en),time:(e.title.match(/\d{1,2}:\d{2}(\s*[-–]\s*\d{1,2}:\d{2})?/)||[''])[0]}))
    .filter(e=>!CONFIG.HIDE_GROUPS.includes(e.group)).sort((a,b)=>a.sn-b.sn||a.en-b.en);
}
const fmt=d=>d.getDate()+' ב'+MONTHS[d.getMonth()];
const range=e=>e.sn!=e.en?fmt(e.s)+' – '+fmt(e.e):fmt(e.s)+' '+e.s.getFullYear();
const mkey=d=>d.getFullYear()*12+d.getMonth();

function filtered(){
  const g=$('#fGroup').value,a=$('#fAud').value,q=$('#q').value.trim();
  return all.filter(e=>(!g||e.group==g)&&(!a||e.aud==a)&&(!q||(e.title+' '+e.aud).includes(q)));
}
function fillFilters(){
  const set=(id,vals)=>{const s=$(id),v=s.value,f=s.options[0];s.innerHTML='';s.append(f);vals.forEach(x=>s.append(new Option(x,x)));s.value=v};
  set('#fGroup',[...new Set(all.map(e=>e.group))]);
  set('#fAud',[...new Set(all.map(e=>e.aud))]);
  $('#legend').innerHTML=[...new Set(all.map(e=>e.group))].map(g=>`<span><i class="dot" style="background:${col(g)}"></i>${esc(g)}</span>`).join('');
}
const chip=e=>`<button class="chip" style="background:${col(e.group)}" data-id="${e.id}" title="${esc(e.title)}">${esc(e.title)}</button>`;
const nav=t=>restricted?`<div class="mnav"><h2>${t}</h2></div>`:`<div class="mnav"><button id="prev" aria-label="חודש קודם">‹</button><h2>${t}</h2><button id="next" aria-label="חודש הבא">›</button></div>`;

function renderMonth(list){
  const y=cur.getFullYear(),m=cur.getMonth(),start=new Date(y,m,1-new Date(y,m,1).getDay(),12),t=dn(new Date());
  let h=nav(MONTHS[m]+' '+y)+'<div class="grid">'+DAYS.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12),n=dn(d);
    if(i>=35&&d.getMonth()!=m)break;
    const ev=list.filter(e=>e.sn<=n&&e.en>=n);
    h+=`<div class="day ${d.getMonth()!=m?'out':''} ${d.getDay()==6?'wk':''} ${n==t?'today':''}"><span class="n"><b>${d.getDate()}</b><small>${esc(hebrew[n]||'')}</small></span>${ev.slice(0,3).map(chip).join('')}${ev.length>3?`<button class="more" data-day="${n}">+${ev.length-3} נוספים</button>`:''}</div>`;
  }
  return h+'</div>';
}
function renderTable(list){
  const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate(),fg=$('#fGroup').value,fa=$('#fAud').value;
  const lay=layouts[y*12+m]||{mon:MONTHS[m],heb:'',cols:[...new Map(all.map(e=>[e.aud,{aud:e.aud,group:e.group}])).values()]};
  const cols=lay.cols.filter(c=>!CONFIG.HIDE_GROUPS.includes(c.group)&&(!fg||c.group==fg)&&(!fa||c.aud==fa));
  const EV='חגים ואירועי לוח שנה',gs=[];
  cols.forEach(c=>{const l=gs[gs.length-1];if(l&&l.g==c.group)l.n++;else gs.push({g:c.group,n:1})});
  let h=nav(MONTHS[m]+' '+y)+'<div class="xs"><table class="xt"><thead><tr><th>'+esc(lay.mon||MONTHS[m])+'</th><th>'+esc(lay.heb)+'</th>'
    +gs.map(g=>`<th colspan="${g.n}" style="background:${g.g==EV?'':col(g.g)}">${g.g==EV?'':esc(g.g)}</th>`).join('')
    +'</tr><tr><th>תאריך</th><th>יום</th>'+cols.map(c=>`<th>${c.group==EV?'שם האירוע':esc(c.aud)}</th>`).join('')+'</tr></thead><tbody>';
  const t=dn(new Date());
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d,12),n=dn(dt),w=dt.getDay();
    h+=`<tr class="${w==6?'wk':''} ${n==t?'today':''}"><td class="d">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}<small>${esc(hebrew[n]||'')}</small></td><td class="w">${DAYS[w]}</td>`
      +cols.map(c=>`<td>${list.filter(e=>e.aud==c.aud&&e.sn<=n&&e.en>=n).map(e=>`<button class="ce" style="--c:${col(e.group)}" data-id="${e.id}">${esc(e.title)}</button>`).join('')}</td>`).join('')+'</tr>';
  }
  return h+'</tbody></table></div>';
}
function stickyH(){
  const t=document.querySelector('.xt'),r=t&&t.querySelector('thead tr');
  if(r)t.style.setProperty('--h1',(r.getBoundingClientRect().height-1)+'px');
}
addEventListener('resize',stickyH);
function renderList(list){
  const q=$('#q').value.trim(),y=cur.getFullYear(),m=cur.getMonth(),a=dn(new Date(y,m,1)),b=dn(new Date(y,m+1,0));
  const ev=q?list:list.filter(e=>e.sn<=b&&e.en>=a);
  const head=q?`<div class="mnav"><h2>תוצאות חיפוש ${restricted?'בחודש הנוכחי':'בכל השנה'} (${ev.length})</h2></div>`:nav(MONTHS[m]+' '+y);
  if(!ev.length)return head+'<div class="empty">אין אירועים להצגה</div>';
  return head+ev.map(e=>`<button class="item" data-id="${e.id}"><i style="background:${col(e.group)}"></i><div><b>${esc(e.title)}</b><span>${esc(e.aud)}</span></div><div class="when">${DAYS[e.s.getDay()]} ${range(e)}</div></button>`).join('');
}
function render(){
  const list=filtered(),q=$('#q').value.trim();
  $('#view').innerHTML=view=='month'?renderMonth(list):view=='table'?renderTable(list):renderList(list);
  const p=$('#prev'),n=$('#next');
  if(p){p.onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};n.onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()}}
  if(view=='table')stickyH();
  const nt=$('#note');
  if(q&&view!='list'){nt.hidden=false;nt.innerHTML=`נמצאו ${list.length} אירועים ${restricted?'בחודש הנוכחי':'בשנה כולה'}. <button id="toList">הצגה ברשימה</button>`;$('#toList').onclick=()=>setView('list')}
  else nt.hidden=true;
}
function setView(v){view=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v==v));render()}
function openEv(id){
  const e=all.find(x=>x.id==id);if(!e)return;
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  $('#dlg').innerHTML=`<div class="dh2" style="background:${col(e.group)}"><h3>${esc(e.title)}</h3></div><dl>${row('תאריך',DAYS[e.s.getDay()]+', '+range(e))}${row('תאריך עברי',hebrew[e.sn])}${row('סוג',e.group)}${row('קהל יעד',e.aud)}${row('שעה',e.time)}</dl><button class="x" onclick="this.closest('dialog').close()">סגירה</button>`;
  if(!$('#dlg').open)$('#dlg').showModal();
}
function openDay(n){
  const d=fromN(n),ev=filtered().filter(e=>e.sn<=n&&e.en>=n);
  $('#dlg').innerHTML=`<div class="dh2" style="background:var(--ink)"><h3>${DAYS[d.getDay()]}, ${fmt(d)}</h3></div>${ev.map(e=>`<button class="item" data-id="${e.id}"><i style="background:${col(e.group)}"></i><div><b>${esc(e.title)}</b><span>${esc(e.aud)}</span></div><span></span></button>`).join('')}<button class="x" style="margin-top:12px" onclick="this.closest('dialog').close()">סגירה</button>`;
  $('#dlg').showModal();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-id],[data-day]');if(!b||!b.closest('#view,#dlg'))return;
  if(b.dataset.day)openDay(+b.dataset.day);else openEv(b.dataset.id);
});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
['#fGroup','#fAud'].forEach(s=>$(s).onchange=render);$('#q').oninput=render;

const getKey=()=>{try{return localStorage.getItem('schoolKey')||''}catch(e){return''}};
const setKey=k=>{try{k?localStorage.setItem('schoolKey',k):localStorage.removeItem('schoolKey')}catch(e){}};
async function fetchTabs(){
  if(!CONFIG.SCRIPT_URL&&CONFIG.SHEET_ID){
    restricted=true;const n=MONTHS[new Date().getMonth()];
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}&t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw new Error('http');
    return [[await r.text(),n]];
  }
  if(!CONFIG.SCRIPT_URL)throw new Error('no-url');
  const k=getKey();
  const r=await fetch(CONFIG.SCRIPT_URL+'?t='+Date.now()+(k?'&key='+encodeURIComponent(k):''),{cache:'no-store'});
  if(!r.ok)throw new Error('http');
  const d=await r.json();
  if(d.error){setKey('');throw new Error('bad-key')}
  restricted=d.mode!=='full';
  return d.tabs.map(t=>[t.csv,t.name]);
}
function goToday(){
  if(!restricted){const n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);render()}
  const el=document.querySelector('tr.today,.day.today');
  if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
}
$('#today').onclick=goToday;
$('#login').onclick=()=>{
  if(!restricted){setKey('');return load()}
  const k=prompt('הדביקו את מפתח הגישה שקיבלתם:');
  if(k&&k.trim()){setKey(k.trim());load()}
};
function todayLabel(){const n=new Date();$('#today').textContent='היום · '+DAYS[n.getDay()]+' '+fmt(n)}
async function load(){
  todayLabel();$('#login').hidden=!CONFIG.SCRIPT_URL;
  $('#title').textContent=CONFIG.TITLE;document.title=CONFIG.TITLE;
  let tabs=[],msg='';
  try{tabs=await fetchTabs()}catch(e){
    if(e.message=='bad-key'){msg='המפתח לא תקין או בוטל. מוצג החודש הנוכחי בלבד.';try{tabs=await fetchTabs()}catch(_){}}
    else{restricted=true;msg=e.message=='no-url'?'הדף עדיין לא מחובר לגיליון.':'לא הצלחנו לטעון את הנתונים. נסו שוב מאוחר יותר.'}
  }
  hebrew={};layouts={};eid=0;
  all=merge(tabs.flatMap(([t,n])=>parseTab(t,n)));
  $('#sub').textContent=msg||(restricted?'מוצג החודש הנוכחי בלבד':'גישה מלאה · מתעדכן אוטומטית');
  $('#login').textContent=restricted?'כניסה למורשים':'יציאה ממצב מלא';
  if(restricted){
    const ks=Object.keys(layouts).map(Number),n=new Date();
    cur=ks.length?new Date(Math.floor(ks[0]/12),ks[0]%12,1):new Date(n.getFullYear(),n.getMonth(),1);
  }else if(!cur&&all.length){
    const now=new Date(),lo=all[0].s,hi=all[all.length-1].e;
    cur=mkey(now)>=mkey(lo)&&mkey(now)<=mkey(hi)?new Date(now.getFullYear(),now.getMonth(),1):new Date(lo.getFullYear(),lo.getMonth(),1);
  }
  cur=cur||new Date();
  fillFilters();render();
}
const hm=location.hash.match(/key=([^&]+)/);
if(hm){setKey(decodeURIComponent(hm[1]));history.replaceState(null,'',location.pathname+location.search)}
load();
if(CONFIG.SCRIPT_URL||CONFIG.SHEET_ID)setInterval(load,CONFIG.REFRESH_MINUTES*60000);
</script>
</body>
</html>
